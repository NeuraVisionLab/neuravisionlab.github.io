<a class="area-card" href="{{ r.url }}" data-reveal style="--i:{{ loop.index0 }}">
        {% if r.image %}<span class="area-thumb"><img src="assets/img/research/{{ r.image }}" alt="" loading="lazy" width="627" height="627"></span>{% else %}{% include "_area_icon.html" %}{% endif %}
        <span class="idx">{{ r.num }} · {{ r.tag }}</span>
        <h3>{{ r.title }}</h3>
        <p class="tag">{{ r.description }}</p>
        <span class="btn-link more">{{ site.home_research_card_link_label }} <span class="arr">→</span></span>
      </a>
