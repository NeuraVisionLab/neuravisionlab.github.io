<dialog class="cite-dialog" data-cite-dialog aria-labelledby="cite-dialog-h">
  <div class="cite-dialog-head">
    <h2 id="cite-dialog-h">BibTeX</h2>
    <button type="button" class="cite-dialog-close" data-cite-close aria-label="Close citation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <pre class="cite-dialog-out" data-cite-out tabindex="0"></pre>
  <div class="cite-dialog-actions">
    <button type="button" class="btn btn-primary" data-cite-copy>Copy BibTeX</button>
    <span class="cite-dialog-status" data-cite-status role="status" aria-live="polite"></span>
  </div>
</dialog>
